<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☢️ LunaRadiation AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-[#05070f] text-white min-h-screen overflow-x-hidden relative transition-colors duration-300" data-theme="dark">
    <div class="stars fixed inset-0 pointer-events-none z-0"></div>

    <div class="relative z-10 max-w-6xl mx-auto p-6">
        <header class="flex flex-col sm:flex-row justify-between items-center mb-10 gap-6">
            <div class="flex items-center gap-4">
                <a href="/" class="text-4xl hover:scale-110 transition-transform" title="На головну">🏠</a>
                <div class="text-6xl drop-shadow-[0_0_15px_#a855f7]">☢️</div>
                <div>
                    <h1 class="text-4xl md:text-5xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-400 to-purple-400" style="font-family: 'Orbitron', sans-serif;">
                        LUNARADIATION AI
                    </h1>
                    <p class="text-purple-300/90 text-lg">Моделювання захисту від космічної радіації</p>
                </div>
            </div>

            <button id="themeToggle" class="text-3xl hover:scale-110 transition-transform" title="Змінити тему">
                🌙
            </button>
        </header>

        <!-- Основна секція -->
        <div class="glass-card p-8 rounded-3xl mb-8">
            <h2 class="text-3xl font-bold mb-8 text-center text-purple-300 drop-shadow-md">Розрахунок радіаційного захисту</h2>
            
            <form id="calculationForm" class="space-y-6 max-w-2xl mx-auto">
                <div>
                    <label class="block text-purple-300 mb-2 font-medium">Матеріал:</label>
                    <select id="material" class="input-cosmic w-full">
                        <option>Алюміній</option>
                        <option>Вода</option>
                        <option>Реголіт</option>
                    </select>
                </div>

                <div>
                    <label class="block text-purple-300 mb-2 font-medium">Товщина (см):</label>
                    <input type="number" id="thickness" step="0.1" required class="input-cosmic">
                </div>

                <div>
                    <label class="block text-purple-300 mb-2 font-medium">Рівень радіації:</label>
                    <input type="number" id="radiationLevel" step="0.1" required class="input-cosmic">
                </div>

                <button type="submit" class="w-full py-4 bg-gradient-to-r from-purple-600 via-pink-600 to-purple-600 hover:from-pink-600 hover:via-purple-600 hover:to-pink-600 transition-all duration-500 font-bold text-lg rounded-2xl shadow-[0_0_40px_#a855f7] hover:shadow-[0_0_70px_#ec4899]">
                    🚀 РОЗРАХУВАТИ
                </button>
            </form>

            <div id="result" class="result mt-8 glass-card p-8 rounded-2xl hidden"></div>
        </div>

        <!-- Таблиця історії -->
        <div class="glass-card p-8 rounded-3xl">
            <h2 class="text-3xl font-bold mb-8 text-center text-purple-300">📜 Історія експериментів</h2>
            <div class="overflow-x-auto">
                <table id="historyTable" class="history-table w-full">
                    <thead>
                        <tr class="bg-black/40 text-purple-300 text-sm uppercase tracking-wider">
                            <th class="p-4 text-left">Матеріал</th>
                            <th class="p-4 text-center">Товщина (см)</th>
                            <th class="p-4 text-center">Рівень радіації</th>
                            <th class="p-4 text-center">Проникнення (%)</th>
                            <th class="p-4 text-center">Безпека</th>
                            <th class="p-4 text-center">Дата</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <footer class="relative z-10 py-8 text-center text-purple-400/70 border-t border-purple-500/20 mt-16">
        <p>☢️ LunaRadiation AI © 2026 | Дослідження захисту від космічної радіації</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
